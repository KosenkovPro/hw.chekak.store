[package]
name = "mcpad-backends-windows"
description = "Источник данных MCPad для Windows: NtQuerySystemInformation и сведения о процессах"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Ядро, контракт проб и привязки Win32 нужны только под Windows: вне Windows
# крейт собирается пустым, и cargo ругался бы на неиспользуемые зависимости.
# Привязки `windows` к тому же существуют только на Windows: сам крейт помечен
# `#![cfg(windows)]`, а его зависимость `windows-future` не собирается на
# других системах — из-за этого падала сборка всего workspace в CI.
[target.'cfg(windows)'.dependencies]
mcpad-core.workspace = true
mcpad-probe.workspace = true
windows.workspace = true

[lints]
workspace = true
