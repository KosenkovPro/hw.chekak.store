[package]
name = "mcpad-cli"
description = "Командная строка MCPad: список процессов, снимок, подробности, возможности"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "mcpad"
path = "src/main.rs"

[dependencies]
mcpad-core.workspace = true
mcpad-probe.workspace = true
mcpad-sampler.workspace = true
clap.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
mcpad-backends-windows.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
mcpad-backends-linux.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mcpad-backends-macos.workspace = true

[lints]
workspace = true
